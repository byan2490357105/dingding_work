#下面这些内容是为了让MyBatis-Plus映射
#指定Mapper文件位置
mybatis-plus.mapper-locations=classpath:mappers/*xml
#指定实体目录
mybatis-plus.type-aliases-package=com.example.backend.entity
# 应用服务 WEB 访问端口
server.port=8080

spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.druid.url=jdbc:mysql://localhost:3306/dingding_work?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.druid.username=root
spring.datasource.druid.password=123456

## ================= 第三方登录：钉钉 =================
## 在钉钉开放平台创建应用后，把 AppKey / AppSecret 填到这里
third-party.dingtalk.enabled=true
third-party.dingtalk.client-id=
third-party.dingtalk.client-secret=
## 授权回调地址必须在钉钉开放平台白名单中
third-party.dingtalk.redirect-uri=http://localhost:8080/api/third-party/dingtalk/callback
## 登录成功后回跳前端（带一次性 ticket）
third-party.dingtalk.frontend-callback-url=http://localhost:5173/#/oauth/callback
## 绑定成功后回跳前端
third-party.dingtalk.bind-result-url=http://localhost:5173/#/settings/bindings
## openid 即可完成扫码/手机号登录；如需手机号需在钉钉后台申请 Contact.User.mobile
third-party.dingtalk.scope=openid
third-party.frontend-error-url=http://localhost:5173/#/oauth/callback

## ================= AI 大模型：DeepSeek =================
## 请到 https://platform.deepseek.com/ 创建 API Key 填入下方
deepseek.enabled=true
deepseek.api-key= //deepseek???
## 聊天补全接口，默认使用官方地址
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
## 单次请求超时（秒），大模型生成月报可能较慢，建议 120 秒
deepseek.timeout-seconds=120

# 邮件配置（定时提醒推送）
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}//邮箱账号
spring.mail.password=${MAIL_PASSWORD:}//邮箱smtp密码
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_USERNAME:}//邮箱账号

